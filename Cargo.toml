[package]
name = "dead-signal"
version = "0.1.0"
edition = "2024"
authors = ["Alva"]
description = "Dead Signal: a low poly first-person zombie extraction roguelite."

[dependencies]
lntrn-app = { path = "../lantern-ui-2/crates/lntrn-app" }
lntrn-ui = { path = "../lantern-ui-2/crates/lntrn-ui" }
lntrn-math = { path = "../lantern-ui-2/crates/lntrn-math" }
lntrn-text = { path = "../lantern-ui-2/crates/lntrn-text" }
lntrn-model = { path = "../lantern-ui-2/crates/lntrn-model" }
lntrn-core = { path = "../lantern-ui-2/crates/lntrn-core" }
lntrn-audio = { path = "../lantern-ui-2/crates/lntrn-audio" }
lntrn-image = { path = "../lantern-ui-2/crates/lntrn-image" }
bevy_ecs = "0.19"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 1
lto = "thin"
